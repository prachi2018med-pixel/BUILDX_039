<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAHAY | Human Connection & Healthcare Emergency</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;

      --bg-outer: #0b1a2d;
      --bg-app: #ffffff;
      --bg-card-blue: #f0f7ff;
      --bg-card-teal: #eefbf7;
      --bg-card-purple: #f6f2fd;
      --bg-card-cyan: #edf9fc;

      --navy-dark: #0a2540;
      --teal-primary: #0d9488;
      --teal-dark: #0f766e;
      --teal-light: #14b8a6;
      
      --sos-red: #ef4444;
      --sos-gradient: linear-gradient(135deg, #0d9488 0%, #10b981 100%);
      
      --text-main: #0f294a;
      --text-muted: #64748b;

      --radius-app: 36px;
      --radius-card: 22px;
      --radius-pill: 9999px;
      
      --shadow-app: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-body);
      background-color: var(--bg-outer);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }

    /* Device Container Frame */
    .app-frame {
      max-width: 440px;
      width: 100%;
      background: var(--bg-app);
      border-radius: var(--radius-app);
      box-shadow: var(--shadow-app);
      padding: 24px 20px 76px 20px;
      position: relative;
      overflow: hidden;
      border: 6px solid #1e293b;
      min-height: 780px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 6px 14px rgba(13, 148, 136, 0.3);
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--navy-dark);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .brand-sub {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--teal-primary);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f1f5f9;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-dark);
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: #e2e8f0; }

    .notification-dot {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 9px;
      height: 9px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      animation: pulseAlert 1.5s infinite;
    }

    @keyframes pulseAlert {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Hero Banner Area */
    .hero-banner {
      position: relative;
      border-radius: var(--radius-card);
      padding: 12px 4px 10px 4px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .hero-top-italic {
      font-style: italic;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .hero-title .dark-text { color: var(--navy-dark); display: block; }
    .hero-title .teal-text { color: var(--teal-primary); display: block; }

    .hero-description {
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text-muted);
      max-width: 220px;
      font-weight: 500;
    }

    .hero-bg-img {
      position: absolute;
      top: 10px;
      right: -20px;
      width: 220px;
      height: 170px;
      background-image: url('./ambulance_hero.jpg');
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      mask-image: radial-gradient(circle at 70% 50%, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
      -webkit-mask-image: radial-gradient(circle at 70% 50%, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
      opacity: 0.9;
      pointer-events: none;
    }

    .pulse-graphic {
      position: absolute;
      top: 18px;
      right: 10px;
      color: var(--teal-primary);
      opacity: 0.8;
    }

    /* Emergency SOS Large Banner Card */
    .sos-banner-card {
      background: var(--sos-gradient);
      border-radius: var(--radius-card);
      padding: 18px 20px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 12px 25px -6px rgba(13, 148, 136, 0.4);
      margin-bottom: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .sos-banner-card:hover { transform: translateY(-2px); }

    .sos-circle-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border: 3px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.6);
      flex-shrink: 0;
    }

    .sos-circle-btn .sos-text {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-top: 2px;
    }

    .sos-content { flex: 1; }
    .sos-content h3 { font-family: var(--font-heading); font-size: 1.2rem; font-weight: 800; margin-bottom: 2px; }
    .sos-content p { font-size: 0.78rem; opacity: 0.9; font-weight: 500; }

    .arrow-circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      color: var(--teal-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 2x2 Feature Grid Cards */
    .feature-grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .grid-card {
      border-radius: var(--radius-card);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 154px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }
    .grid-card:hover { transform: translateY(-3px); }

    .grid-card.blue { background: var(--bg-card-blue); }
    .grid-card.teal { background: var(--bg-card-teal); }
    .grid-card.purple { background: var(--bg-card-purple); }
    .grid-card.cyan { background: var(--bg-card-cyan); }

    .card-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 12px;
    }

    .card-icon-box.blue { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
    .card-icon-box.teal { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
    .card-icon-box.purple { background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%); }
    .card-icon-box.cyan { background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%); }

    .card-main-title {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy-dark);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .card-main-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
      font-weight: 500;
    }

    .card-arrow-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-arrow-btn.blue { background: #dbeafe; color: #1d4ed8; }
    .card-arrow-btn.teal { background: #d1fae5; color: #047857; }
    .card-arrow-btn.purple { background: #f3e8ff; color: #6b21a8; }
    .card-arrow-btn.cyan { background: #cffafe; color: #0e7490; }

    /* --- SAHAY SMART ALERT & GUIDANCE SYSTEM STYLING --- */
    .smart-guidance-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-radius: var(--radius-card);
      padding: 16px 18px;
      color: white;
      margin-bottom: 20px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
      transition: transform 0.2s ease;
    }
    .smart-guidance-banner:hover { transform: translateY(-2px); }

    .guidance-banner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .guidance-banner-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.05rem;
    }

    .live-pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
      animation: pulseAlert 1.5s infinite;
    }

    .alerts-count-badge {
      font-size: 0.7rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 9px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .guidance-banner-sub {
      font-size: 0.78rem;
      opacity: 0.85;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .guidance-pill-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .g-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
    }
    .g-pill.danger { color: #fca5a5; background: rgba(239, 68, 68, 0.2); }
    .g-pill.warning { color: #fed7aa; background: rgba(249, 115, 22, 0.2); }
    .g-pill.safe { color: #86efac; background: rgba(16, 185, 129, 0.2); }
    .g-pill.info { color: #93c5fd; background: rgba(59, 130, 246, 0.2); }

    .sahay-alert-panel {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      border: 1px solid #e2e8f0;
      max-width: 420px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .alert-panel-header {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--navy-dark);
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .alert-filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .alert-filter-pill {
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--navy-dark);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .alert-filter-pill.active {
      background: var(--navy-dark);
      color: white;
      border-color: var(--navy-dark);
    }

    .simulator-bar {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .simulator-title {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .simulator-buttons {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .sim-btn {
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: white;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      color: var(--navy-dark);
    }
    .sim-btn:hover { background: #e2e8f0; }

    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .smart-alert-card {
      border-radius: 16px;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: #ffffff;
    }
    .smart-alert-card:hover { transform: translateY(-1px); }

    .smart-alert-card.danger {
      background: #fff1f2;
      border-color: #fda4af;
      border-left: 5px solid #ef4444;
    }

    .smart-alert-card.warning {
      background: #fff7ed;
      border-color: #fed7aa;
      border-left: 5px solid #f97316;
    }

    .smart-alert-card.safe {
      background: #f0fdf4;
      border-color: #a7f3d0;
      border-left: 5px solid #10b981;
    }

    .smart-alert-card.info {
      background: #eff6ff;
      border-color: #bfdbfe;
      border-left: 5px solid #3b82f6;
    }

    .alert-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .alert-card-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-icon-circle {
      font-size: 1.1rem;
      line-height: 1;
    }

    .alert-card-title {
      font-family: var(--font-heading);
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--navy-dark);
    }

    .alert-badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .alert-badge.danger { background: #fee2e2; color: #991b1b; }
    .alert-badge.warning { background: #ffedd5; color: #9a3412; }
    .alert-badge.safe { background: #d1fae5; color: #065f46; }
    .alert-badge.info { background: #dbeafe; color: #1e40af; }

    .alert-situation-box {
      background: rgba(255, 255, 255, 0.75);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
      border: 1px dashed rgba(0, 0, 0, 0.12);
    }

    .alert-explanation {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .alert-guidance-box {
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .guidance-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.76rem;
      line-height: 1.35;
      margin-bottom: 5px;
    }
    .guidance-row:last-child { margin-bottom: 0; }

    .guidance-label {
      font-weight: 800;
      color: var(--navy-dark);
      flex-shrink: 0;
    }

    .btn-alert-planb {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-alert-planb:hover { opacity: 0.9; }

    .btn-alert-planb.danger { background: #dc2626; color: white; }
    .btn-alert-planb.warning { background: #ea580c; color: white; }
    .btn-alert-planb.safe { background: #059669; color: white; }
    .btn-alert-planb.info { background: #2563eb; color: white; }

    /* Push Notification Popup Banner */
    .smart-push-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      max-width: 380px;
      width: 90%;
      background: #ffffff;
      border-left: 5px solid #ef4444;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      animation: bounceIn 0.35s ease-out;
    }

    @keyframes bounceIn {
      0% { transform: translate(-50%, -50px); opacity: 0; }
      100% { transform: translate(-50%, 0); opacity: 1; }
    }

    /* Sticky Bottom Mobile Nav */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: white;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 20;
      padding: 0 10px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      position: relative;
    }

    .nav-item.active {
      color: var(--teal-primary);
      font-weight: 700;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      width: 24px;
      height: 3px;
      background: var(--teal-primary);
      border-radius: 2px;
    }

    /* Modal Overlay View for Dedicated Modules */
    .module-view-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: white;
      padding: 20px 20px 80px 20px;
      overflow-y: auto;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--navy-dark);
      cursor: pointer;
    }

    .gps-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #0d9488, #10b981);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
    }

    .city-pill-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .city-pill {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--navy-dark);
      cursor: pointer;
      white-space: nowrap;
    }

    .city-pill.active {
      background: var(--navy-dark);
      color: white;
      border-color: var(--navy-dark);
    }

    .module-card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .module-card {
      background: #f8fafc;
      border-radius: 18px;

          {/* Toast Notification */}
          {toastMsg && (
            <div style={{ position: 'fixed', bottom: '80px', left: '50%', transform: 'translateX(-50%)', zIndex: 120, background: 'var(--navy-dark)', color: 'white', padding: '10px 18px', borderRadius: '12px', boxShadow: 'var(--shadow-app)', fontWeight: 600, fontSize: '0.82rem', whiteSpace: 'nowrap' }}>
              {toastMsg}
            </div>
          )}

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      <EmergencyProvider>
        <App />
      </EmergencyProvider>
    );
  </script>
</body>
</html>
